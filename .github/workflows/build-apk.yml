name: SeyirPlus M3U TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android API 36 paketlerini kur
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: APK derle
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: SeyirPlus-M3U-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
