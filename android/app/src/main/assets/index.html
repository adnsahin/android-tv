<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d1a">
<title>SeyirPlus M3U TV</title>
<style>
:root{--bg:#0d0d1a;--bg2:#141428;--card:#1c1c38;--card2:#242450;--line:rgba(255,255,255,.09);--txt:#f4f4fa;--dim:#9a9ab6;--acc:#e94560;--acc2:#ff8e53;--gold:#ffd700;--ok:#3ddc97;--grad:linear-gradient(135deg,#e94560,#ff8e53);--r:15px;--shadow:0 10px 30px rgba(0,0,0,.42)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{font-family:Segoe UI,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);background-image:radial-gradient(1100px 450px at 85% -10%,rgba(233,69,96,.13),transparent 60%)}button,input,select{font:inherit}.hide{display:none!important}
.hdr{position:sticky;top:0;z-index:50;background:rgba(13,13,26,.9);backdrop-filter:blur(13px);border-bottom:1px solid var(--line);padding:12px 18px}.hdrin{max-width:1300px;margin:auto;display:flex;gap:12px;align-items:center}.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;white-space:nowrap}.logoic{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 15px rgba(233,69,96,.4)}.search{flex:1;max-width:570px;margin-left:auto}.search input{width:100%;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.055);color:#fff;padding:11px 17px;outline:none}.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(233,69,96,.18)}
.app{max-width:1300px;margin:auto;padding:14px 18px 80px}.toprow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tab,.chip,.btn{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--dim);border-radius:22px;padding:9px 17px;font-weight:750;cursor:pointer;transition:.15s}.tab.a,.chip.a,.btn.primary{background:var(--grad);color:#fff;border-color:transparent}.btn{border-radius:11px;color:#fff;padding:10px 14px}.btn.danger{color:#ff8797}.btn.ok{color:var(--ok)}.btn.small{font-size:12px;padding:7px 10px}.spacer{flex:1}.status{font-size:12px;color:var(--dim);padding:7px 11px;border:1px solid var(--line);border-radius:18px}.status.ok{color:var(--ok)}.status.err{color:#ff8797}.sectionTitle{font-size:11px;color:var(--acc);font-weight:900;letter-spacing:.9px;text-transform:uppercase;margin:12px 2px 7px}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;padding:7px 13px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-top:12px}.card{position:relative;background:var(--card);border:1px solid transparent;border-radius:var(--r);overflow:hidden;color:#fff;text-align:left;cursor:pointer;transition:.18s;min-width:0}.card:hover,.card:focus{outline:none;transform:translateY(-4px) scale(1.015);border-color:rgba(233,69,96,.65);box-shadow:var(--shadow)}.posterWrap{aspect-ratio:2/3;background:linear-gradient(145deg,#242450,#121224);overflow:hidden;position:relative;display:grid;place-items:center}.poster{width:100%;height:100%;object-fit:cover;display:block}.card.live .poster{object-fit:contain;padding:17px;background:linear-gradient(145deg,#242450,#141425)}.fallback{font-size:34px;font-weight:900;color:rgba(255,255,255,.24)}.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:4px 7px;font-size:9px;font-weight:900;color:var(--gold)}.badge.live{background:rgba(233,69,96,.94);color:white}.count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.72);border-radius:9px;padding:4px 7px;font-size:9px}.body{padding:10px 11px 12px}.title{font-size:13px;font-weight:800;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10.5px;color:var(--dim);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty,.loading{padding:60px 20px;text-align:center;color:var(--dim)}.empty b{display:block;color:#fff;font-size:17px;margin-bottom:7px}.spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.74);align-items:center;justify-content:center;padding:20px}.modal.a{display:flex}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:20px;box-shadow:0 25px 80px rgba(0,0,0,.6)}.dialog h2{font-size:20px;margin-bottom:15px}.field{margin-bottom:12px}.field label{display:block;color:var(--dim);font-size:11px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--acc)}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}.sourceList{display:grid;gap:9px;margin-top:12px}.source{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px}.sourceTop{display:flex;gap:9px;align-items:flex-start}.sourceName{font-weight:850}.sourceHost{font-size:10.5px;color:var(--dim);margin-top:3px}.sourceBtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.sourceMeta{font-size:10.5px;color:var(--dim);margin-top:7px}.note{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:8px}
.detail{display:none}.detail.a{display:block}.detailHead{display:flex;gap:16px;align-items:center;margin:8px 0 15px}.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:22px}.detailTitle{font-size:24px;font-weight:900}.seasonRow{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.ep{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:13px;text-align:left;font-weight:800}.ep small{display:block;color:var(--dim);margin-top:5px;font-weight:500}.ep:hover,.ep:focus,.back:hover,.back:focus,.tab:hover,.tab:focus,.chip:hover,.chip:focus,.btn:hover,.btn:focus,.source button:focus{outline:3px solid var(--acc);outline-offset:2px;transform:scale(1.03)}
.toastWrap{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:500}.toast{background:#242450;border:1px solid var(--line);border-radius:12px;padding:11px 17px;margin-top:7px;box-shadow:var(--shadow);font-size:13px}
.webPlayer{display:none;position:fixed;inset:0;z-index:300;background:#000}.webPlayer.a{display:flex;flex-direction:column}.webPlayerHead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#101020}.webPlayerTitle{flex:1;font-size:14px;font-weight:800;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.webPlayerBody{flex:1;min-height:0;display:grid;place-items:center;position:relative}.webPlayerBody video{width:100%;height:100%;background:#000}.webPlayerMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);padding:20px}.webPlayerMsg b{color:#fff;display:block;margin-bottom:8px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:17px}.card .title{font-size:14px}.app{padding-left:28px;padding-right:28px}.hdr{padding-left:28px;padding-right:28px}}
@media(max-width:650px){.logo span:last-child{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.search{max-width:none}.dialog{padding:15px}.detailTitle{font-size:19px}}
</style>
</head>
<body>
<header class="hdr"><div class="hdrin"><div class="logo"><span class="logoic">M3U</span><span>SeyirPlus M3U TV</span></div><div class="search"><input id="search" placeholder="Kanal, film veya dizi ara..." autocomplete="off"></div><button class="btn" id="sourcesBtn">⚙ Kaynaklar</button></div></header>
<main class="app">
<section id="catalog">
<div class="toprow"><button class="tab a" data-type="live">📡 Canlı TV</button><button class="tab" data-type="movie">🎬 Filmler</button><button class="tab" data-type="series">📺 Diziler</button><span class="spacer"></span><span class="status" id="status">Hazırlanıyor</span><button class="btn" id="refreshBtn">↻ Yenile</button></div>
<div class="sectionTitle" id="catLabel">Kategoriler</div><div class="chips" id="categories"></div>
<div class="loading" id="loading"><div class="spinner"></div>Listeler yükleniyor...</div>
<div class="grid" id="grid"></div>
<div class="empty hide" id="empty"><b>İçerik bulunamadı</b><span id="emptyText">Kaynak ekleyin veya filtreyi değiştirin.</span></div>
</section>
<section class="detail" id="seriesDetail"><div class="detailHead"><button class="back" id="detailBack">←</button><div><div class="detailTitle" id="seriesTitle"></div><div class="meta" id="seriesMeta"></div></div></div><div class="seasonRow" id="seasons"></div><div class="epgrid" id="episodes"></div></section>
</main>

<div class="modal" id="sourcesModal"><div class="dialog"><h2>M3U Kaynakları</h2><div class="sourceList" id="sourceList"></div><div class="actions"><button class="btn" id="closeSources">Kapat</button><button class="btn primary" id="addSource">＋ Kaynak Ekle</button></div><div class="note">Kaynak adresleri cihazda kaydedilir. APK içine varsayılan kaynak gömmek için <b>embedded_sources.json</b> dosyasını düzenleyebilirsiniz.</div></div></div>
<div class="modal" id="editModal"><div class="dialog"><h2 id="editTitle">M3U Kaynağı Ekle</h2><input type="hidden" id="editId"><div class="field"><label>Kaynak adı</label><input id="srcName" placeholder="Örn. Ev IPTV"></div><div class="field"><label>M3U / M3U8 adresi</label><input id="srcUrl" placeholder="http://sunucu/get.php?..." autocomplete="off"></div><div class="field"><label>İçerik türü</label><select id="srcType"><option value="auto">Otomatik</option><option value="live">Canlı TV</option><option value="movie">Film</option><option value="series">Dizi</option></select></div><div class="field"><label>Referer (isteğe bağlı)</label><input id="srcReferer"></div><div class="field"><label>User-Agent (isteğe bağlı)</label><input id="srcUa"></div><div class="actions"><button class="btn" id="cancelEdit">Vazgeç</button><button class="btn primary" id="saveSource">Kaydet</button></div></div></div>
<div class="webPlayer" id="webPlayer"><div class="webPlayerHead"><div class="webPlayerTitle" id="webPlayerTitle">Video</div><button class="btn" id="webNext">Sonraki Kaynak</button><button class="btn" id="webClose">✕ Kapat</button></div><div class="webPlayerBody" id="webPlayerBody"></div></div>
<div class="toastWrap" id="toasts"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const state={sources:[],items:[],type:'live',category:'all',query:'',series:null,season:null,refreshing:0,favs:{}};
const native=!!(window.Android&&Android.fetchText);
let reqSeq=1, pending={};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('toasts').appendChild(e);setTimeout(()=>e.remove(),2600)}
function norm(s){return String(s||'').toLocaleLowerCase('tr-TR').replace(/[ç]/g,'c').replace(/[ğ]/g,'g').replace(/[ı]/g,'i').replace(/[ö]/g,'o').replace(/[ş]/g,'s').replace(/[ü]/g,'u').replace(/&amp;/g,'&').replace(/[^a-z0-9]+/g,' ').trim()}
function hash(s){let h=2166136261;for(const c of String(s||'')){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function host(u){try{return new URL(u).host}catch(e){return 'Adres gizli'}}
function decode(s){return String(s||'').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'").replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')}
function resolveUrl(raw,base){try{return new URL(String(raw||'').trim(),base).href}catch(e){return String(raw||'').trim()}}
function loadFavs(){try{state.favs=JSON.parse(localStorage.getItem('sp_m3u_favs')||'{}')}catch(e){state.favs={}}}
function saveFavs(){localStorage.setItem('sp_m3u_favs',JSON.stringify(state.favs))}
function nativeSources(){try{return JSON.parse(Android.loadSources()||'[]')}catch(e){return []}}
async function webSources(){let saved=localStorage.getItem('sp_m3u_sources');if(saved){try{return JSON.parse(saved)}catch(e){}}try{const r=await fetch('embedded_sources.json');const x=await r.json();localStorage.setItem('sp_m3u_sources',JSON.stringify(x));return x}catch(e){return []}}
async function loadSources(){state.sources=native?nativeSources():await webSources();state.sources=Array.isArray(state.sources)?state.sources:[];renderSources()}
function saveSources(){const s=JSON.stringify(state.sources);if(native)Android.saveSources(s);else localStorage.setItem('sp_m3u_sources',s)}
window.__nativeFetchResult=function(id,ok,payload,status){const p=pending[id];if(!p)return;delete pending[id];ok?p.resolve({text:payload,status:status||200}):p.reject(new Error(payload||('HTTP '+status)))};window.__nativeFetchChunk=function(id,chunk,last,status){const p=pending[id];if(!p)return;p.buf=(p.buf||'')+(chunk||'');if(last){delete pending[id];p.resolve({text:p.buf,status:status||200})}};
function proxyOrigin(){const h=location.hostname||'127.0.0.1';return 'http://'+h+':8091'}function fetchText(url,headers){if(native){return new Promise((resolve,reject)=>{const id='r'+(reqSeq++);pending[id]={resolve,reject};Android.fetchText(id,url,JSON.stringify(headers||{}))})}return fetch(url,{headers:headers||{},cache:'no-store'}).then(async r=>{if(!r.ok)throw new Error('HTTP '+r.status);return{text:await r.text(),status:r.status}}).catch(async e=>{const h=headers||{},q='?url='+encodeURIComponent(url)+(h.Referer?'&ref='+encodeURIComponent(h.Referer):'')+(h['User-Agent']?'&ua='+encodeURIComponent(h['User-Agent']):'');const r=await fetch(proxyOrigin()+'/m3u'+q,{cache:'no-store'});if(!r.ok)throw e;return{text:await r.text(),status:r.status}})}
function cacheRead(id){if(native){try{return Android.readCache(id)||''}catch(e){return ''}}return ''}
function cacheWrite(id,text){if(native){try{Android.writeCache(id,text)}catch(e){}}}
function splitExtInf(line){let q=false,qq='',comma=-1;for(let i=0;i<line.length;i++){const c=line[i];if((c==='"'||c==="'")&&(!q||c===qq)){q=!q;qq=q?c:''}else if(c===','&&!q){comma=i;break}}return comma>=0?[line.slice(0,comma),line.slice(comma+1).trim()]:[line,'']}
function attrs(head){const o={};const re=/([\w-]+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s]+))/g;let m;while((m=re.exec(head)))o[m[1].toLowerCase()]=m[2]??m[3]??m[4];return o}
function classify(meta,url,forced){if(forced&&forced!=='auto')return forced;const h=norm((meta.group||'')+' '+(meta.name||'')+' '+url);if(/\b(dizi|series|season|sezon)\b|\bs\d{1,2}\s*e\d{1,3}\b|\b\d{1,2}x\d{1,3}\b/.test(h)||/\/series\//i.test(url))return'series';if(/\b(film|movie|movies|vod|sinema)\b/.test(h)||/\/movie\//i.test(url)||/\.(mp4|mkv|avi|mov)(\?|$)/i.test(url))return'movie';return'live'}
function parseM3U(text,src){text=String(text||'').replace(/^\uFEFF/,'');if(/#EXT-X-(TARGETDURATION|STREAM-INF|MEDIA-SEQUENCE)/i.test(text))return[{id:hash(src.id+'|'+src.url),sourceId:src.id,sourceName:src.name,name:src.name,url:src.url,logo:'',group:'Canlı TV',type:src.type==='auto'?'live':src.type,referer:src.referer||'',userAgent:src.userAgent||'',year:''}];const lines=text.replace(/\r/g,'').split('\n');let out=[],p=null,def={referer:src.referer||'',userAgent:src.userAgent||''};for(let line of lines){line=line.trim();if(!line)continue;if(/^#EXTINF:/i.test(line)){const pr=splitExtInf(line),a=attrs(pr[0]);p={name:decode(pr[1]||a['tvg-name']||'İsimsiz'),logo:decode(a['tvg-logo']||a['stream-icon']||a['cover']||a['poster']||''),group:decode(a['group-title']||a['group']||'Diğer'),tvgId:a['tvg-id']||'',referer:a['http-referrer']||a['referrer']||def.referer,userAgent:a['http-user-agent']||a['user-agent']||def.userAgent,year:a['year']||''};continue}if(/^#EXTGRP:/i.test(line)){if(p)p.group=line.slice(line.indexOf(':')+1).trim()||p.group;continue}if(/^#EXTVLCOPT:http-referrer=/i.test(line)){const v=line.split('=').slice(1).join('=');p?p.referer=v:def.referer=v;continue}if(/^#EXTVLCOPT:http-user-agent=/i.test(line)){const v=line.split('=').slice(1).join('=');p?p.userAgent=v:def.userAgent=v;continue}if(line[0]==='#')continue;const meta=p||{name:'İsimsiz',logo:'',group:'Diğer',referer:def.referer,userAgent:def.userAgent,year:''};let raw=line,ua=meta.userAgent,ref=meta.referer;if(raw.includes('|')){const z=raw.split('|');raw=z.shift();z.join('|').split('&').forEach(pair=>{const k=norm(decodeURIComponent((pair.split('=')[0]||''))),v=decodeURIComponent(pair.split('=').slice(1).join('=')||'');if(k.includes('referer')||k.includes('referrer'))ref=v;if(k.includes('user agent')||k==='useragent')ua=v})}const url=resolveUrl(raw,src.url);if(!/^https?:\/\//i.test(url)){p=null;continue}const type=classify(meta,url,src.type||'auto');out.push({id:hash(src.id+'|'+meta.name+'|'+url),sourceId:src.id,sourceName:src.name,name:meta.name,url,logo:meta.logo?resolveUrl(meta.logo,src.url):'',group:meta.group||'Diğer',type,tvgId:meta.tvgId||'',referer:ref||'',userAgent:ua||'',year:meta.year||''});p=null}return out}
function xtream(src){try{const u=new URL(src.url),username=u.searchParams.get('username'),password=u.searchParams.get('password');return username&&password?{origin:u.origin,username,password}:null}catch(e){return null}}
function streamId(url){try{const p=new URL(url).pathname.split('/').filter(Boolean),x=(p[p.length-1]||'').replace(/\.[a-z0-9]+$/i,'');return /^\d+$/.test(x)?x:''}catch(e){return''}}
async function enrich(items,src){const x=xtream(src);if(!x||!items.length)return items;const types={};items.forEach(i=>types[i.type]=1);const calls=[];async function api(action,key){try{const u=x.origin+'/player_api.php?username='+encodeURIComponent(x.username)+'&password='+encodeURIComponent(x.password)+'&action='+action;const r=await fetchText(u,{'User-Agent':src.userAgent||'Mozilla/5.0','Referer':src.referer||''});return[key,JSON.parse(r.text)]}catch(e){return[key,[]]}}if(types.live){calls.push(api('get_live_streams','live'),api('get_live_categories','liveCats'))}if(types.movie){calls.push(api('get_vod_streams','movie'),api('get_vod_categories','movieCats'))}if(types.series){calls.push(api('get_series','series'),api('get_series_categories','seriesCats'))}const parts=await Promise.all(calls),p={live:[],movie:[],series:[],liveCats:[],movieCats:[],seriesCats:[]};parts.forEach(z=>p[z[0]]=z[1]);const banks={},cats={};['live','movie','series'].forEach(t=>{banks[t]={id:{},name:{}};const arr=Array.isArray(p[t])?p[t]:[];arr.forEach(m=>{const id=String(m.stream_id??m.series_id??'');if(id)banks[t].id[id]=m;const k=norm(m.name||m.title||'');if(k&&!banks[t].name[k])banks[t].name[k]=m});cats[t]={};const ca=Array.isArray(p[t==='movie'?'movieCats':t==='series'?'seriesCats':'liveCats'])?p[t==='movie'?'movieCats':t==='series'?'seriesCats':'liveCats']:[];ca.forEach(c=>{const id=String(c.category_id??c.id??'');if(id)cats[t][id]=decode(c.category_name||c.name||'')})});items.forEach(i=>{const b=banks[i.type]||banks.live,m=(streamId(i.url)&&b.id[streamId(i.url)])||b.name[norm(i.type==='series'?seriesIdentity(i.name).base:i.name)];if(!m)return;const art=m.stream_icon||m.cover||m.cover_big||m.movie_image||m.poster||'';if(!i.logo&&art)i.logo=resolveUrl(art,x.origin);const cid=String(m.category_id??'');if(cats[i.type]&&cats[i.type][cid])i.group=cats[i.type][cid];if(!i.year){const y=String(m.year||m.releaseDate||m.release_date||'').match(/(?:19|20)\d{2}/);if(y)i.year=y[0]}});return items}
function seriesIdentity(name){let s=String(name||'').trim(),m=s.match(/^(.*?)[\s._-]+S(\d{1,2})[\s._-]*E(\d{1,3})(?:\b|[\s._-])/i);if(!m)m=s.match(/^(.*?)[\s._-]+(\d{1,2})x(\d{1,3})(?:\b|[\s._-])/i);if(m)return{base:m[1].replace(/[._]+/g,' ').trim(),season:+m[2],episode:+m[3]};m=s.match(/^(.*?)(?:\s+-\s+|\s+)(?:Sezon|Season)\s*(\d{1,2}).*?(?:Bölüm|Bolum|Episode|Ep)\s*(\d{1,3})/i);if(m)return{base:m[1].trim(),season:+m[2],episode:+m[3]};return{base:s,season:1,episode:0}}

function catalog(type){const items=state.items.filter(i=>i.type===type);if(type==='series'){const map={};for(const i of items){const x=seriesIdentity(i.name),key=norm(x.base);if(!map[key])map[key]={key,type:'series',name:x.base,logo:i.logo,logoRef:i.referer||'',logoUa:i.userAgent||'',group:i.group||'Diğer',episodes:[],groups:new Set()};const c=map[key];if(i.logo&&!c.logo){c.logo=i.logo;c.logoRef=i.referer||'';c.logoUa=i.userAgent||'';}c.groups.add(i.group||'Diğer');c.episodes.push({...i,season:x.season,episode:x.episode})}return Object.values(map).map(c=>{c.groups=[...c.groups];return c})}const map={};for(const i of items){const key=(i.tvgId?('id:'+i.tvgId):norm(i.name)+(type==='movie'&&i.year?'|'+i.year:''));if(!map[key])map[key]={key,type,name:i.name,logo:i.logo,logoRef:i.referer||'',logoUa:i.userAgent||'',group:i.group||'Diğer',year:i.year||'',variants:[],groups:new Set()};const c=map[key];c.variants.push(i);c.groups.add(i.group||'Diğer');if(!c.logo&&i.logo){c.logo=i.logo;c.logoRef=i.referer||'';c.logoUa=i.userAgent||'';}}return Object.values(map).map(c=>{c.groups=[...c.groups];return c})}

function openCatalog(c){if(c.type==='series'){state.series=c;state.season=[...new Set(c.episodes.map(e=>e.season))].sort((a,b)=>a-b)[0]||1;$('catalog').classList.add('hide');$('seriesDetail').classList.add('a');$('seriesTitle').textContent=c.name;$('seriesMeta').textContent=(c.groups||[]).join(' / ');renderSeries();setTimeout(focusFirst,80)}else playVariants(c.name,c.variants)}
function renderSeries(){const c=state.series;if(!c)return;const ss=[...new Set(c.episodes.map(e=>e.season))].sort((a,b)=>a-b);$('seasons').innerHTML='';ss.forEach(s=>{const b=document.createElement('button');b.className='chip'+(state.season===s?' a':'');b.textContent=s+'. Sezon';b.onclick=()=>{state.season=s;renderSeries()};$('seasons').appendChild(b)});const eps=c.episodes.filter(e=>e.season===state.season);const grouped={};eps.forEach(e=>{const k=e.episode||0;(grouped[k]||(grouped[k]=[])).push(e)});$('episodes').innerHTML='';Object.keys(grouped).map(Number).sort((a,b)=>a-b).forEach(ep=>{const arr=grouped[ep],b=document.createElement('button');b.className='ep';b.innerHTML=(ep?('Bölüm '+ep):'Özel Bölüm')+'<small>'+arr.map(x=>x.sourceName).join(' · ')+'</small>';b.onclick=()=>playVariants(c.name+' - S'+state.season+' B'+ep,arr);$('episodes').appendChild(b)})}

function focusables(){let root=document.body;if($('editModal').classList.contains('a'))root=$('editModal');else if($('sourcesModal').classList.contains('a'))root=$('sourcesModal');else if($('seriesDetail').classList.contains('a'))root=$('seriesDetail');return [...root.querySelectorAll('button:not(.hide),input:not(.hide),select:not(.hide)')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&!e.disabled})}

function move(dir){const els=focusables(),cur=document.activeElement;if(!els.length)return;const r=cur&&cur.getBoundingClientRect?cur.getBoundingClientRect():{left:0,top:0,width:0,height:0};const cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,score=1e9;els.forEach(e=>{if(e===cur)return;const q=e.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;let ok=false;if(dir==='left')ok=dx<-5&&Math.abs(dy)<Math.max(q.height,r.height,70)*1.6;if(dir==='right')ok=dx>5&&Math.abs(dy)<Math.max(q.height,r.height,70)*1.6;if(dir==='up')ok=dy<-5&&Math.abs(dx)<Math.max(q.width,r.width,100)*1.6;if(dir==='down')ok=dy>5&&Math.abs(dx)<Math.max(q.width,r.width,100)*1.6;if(!ok)return;const sc=Math.abs(dx)+(Math.abs(dy)*1.25);if(sc<score){score=sc;best=e}});if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}}
